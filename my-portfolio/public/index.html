    <!-- Set the colour theme before first paint to avoid a flash. Dark is the
         default; a one-time reset moves existing visitors off any previously
         saved theme so dark reasserts. Afterwards the navbar toggle persists
         the choice normally. Kept in sync with Chakra by <ColorModeSync/>. -->
    <script>
      (function () {
        try {
          if (!localStorage.getItem("theme-default-v2")) {
            localStorage.setItem("chakra-ui-color-mode", "dark");
            localStorage.setItem("theme-default-v2", "1");
          }
          var mode = localStorage.getItem("chakra-ui-color-mode") || "dark";
          document.documentElement.setAttribute("data-theme", mode);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
